# PrivChat 压测配置
# 与可执行文件同目录，或通过 --config / -c 指定

# -----------------------------------------------------------------------------
# [server] 服务端连接
# -----------------------------------------------------------------------------
[server]
# 服务端地址
host = "127.0.0.1"
# 端口（默认 9001）
port = 9001
# 协议：quic | tcp | websocket
protocol = "quic"
# 本地 QUIC 压测默认自动允许自签证书；远端压测建议显式设为 false。
# allow_self_signed_quic = true

# -----------------------------------------------------------------------------
# [users] 用户与账号
# -----------------------------------------------------------------------------
[users]
# 需要的用户总数（主账号 1 + 机器人 N-1）；不足时自动注册并写入 data/users.txt
total = 1000

# -----------------------------------------------------------------------------
# [scenario] 压测场景
# -----------------------------------------------------------------------------
[scenario]
# 场景类型（可选项）：
#   group_broadcast - 主账号建群、邀请所有人进群、主账号按速率发群消息（默认）
#   friend_flow     - 主账号依次对每个 bot 发好友申请、各 bot 接受，一轮统计成功数
#   private_chat    - 暂用 group_broadcast 实现，后续扩展私聊压测
#   fanout_stress   - 暂用 group_broadcast 实现，后续扩展
#   mixed           - 暂用 group_broadcast 实现，后续扩展混合场景
type = "group_broadcast"

# -----------------------------------------------------------------------------
# [rate] 速率限制（可选，有默认值）
# -----------------------------------------------------------------------------
[rate]
# 建连速率：0 = 全速建连（服务端已支持万级并发）
connect_per_sec = 0
# 并发建连上限（connect_per_sec=0 时生效，1000 用户全速建连）
connect_concurrent = 1000
# 发消息速率：主账号每秒发送多少条消息（加大压测力度）
msg_per_sec = 2000

# -----------------------------------------------------------------------------
# [run] 运行参数
# -----------------------------------------------------------------------------
[run]
# 压测持续时间（秒）；加长以持续施压
duration_sec = 60
