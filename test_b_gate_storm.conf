# G7 背压 gate —— storm 测试床变体（端口对齐 privchat-server/config.storm.toml）。
# 与 test_b_gate.conf 唯一差异：port 9001 → 9501（storm gateway）。
# 判据/负载/时长完全一致；tier 由拓扑决定，co-located 运行最高 smoke PASS。
#
# 运行前置：
#   export LOAD_TEST_SERVER_PID=<privchat-server pid>   # require_server_rss=true，缺/错 → FAIL
#   export LOAD_TEST_METRICS_URL=http://127.0.0.1:9583/metrics
#   ./target/release/privchat-load --config test_b_gate_storm.conf

[server]
host = "127.0.0.1"
port = 9501
protocol = "tcp"

[users]
total = 100

[scenario]
type = "backpressure"

[rate]
connect_per_sec = 0
connect_concurrent = 50
msg_per_sec = 200
min_sender_tps = 50.0
require_server_rss = true
message_payload_bytes = 4096

[run]
duration_sec = 600
socket_stall = true