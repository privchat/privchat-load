# Scenario B: Backpressure —— GATE profile
# 对应 REVIEW_CHECKLIST §B B-PASS-1 + REMEDIATION §0 G7。
# 与 test_b.conf(smoke, 20 用户/10s/tps SKIP)区分:gate 用更大负载 + 10min + 断言 sender_tps。
# ⚠️ 未实跑达标前，REMEDIATION 证据只能标 Harness ready / smoke passed，不得标 gate PASS。
# 慢消费者仍是 SDK 级(subscribe+sleep)；真正 socket-stall 背压是 gate 完整性后续项。

[server]
host = "127.0.0.1"
port = 9001
protocol = "quic"

[users]
total = 100

[scenario]
type = "backpressure"

[rate]
connect_per_sec = 0
connect_concurrent = 50
msg_per_sec = 200
# gate 断言发送端吞吐下限(§B：慢消费者下发送端不应崩塌)
min_sender_tps = 50.0

[run]
duration_sec = 600
warmup_sec = 30
