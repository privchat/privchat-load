# Scenario B: Backpressure —— GATE profile
# 对应 REVIEW_CHECKLIST §B B-PASS-1 + REMEDIATION §0 G7。
# 与 test_b.conf(smoke, 20 用户/10s/tps SKIP)区分:gate 用更大负载 + 10min + 断言 sender_tps。
#
# ⚠️ gate PASS 前置(缺一不可,未满足前 REMEDIATION 只能标 Harness ready / smoke passed):
#   1) 必须 export LOAD_TEST_SERVER_PID=<privchat-server pid> —— 否则 RSS 断言 SKIP
#      (§B 是 server RSS,不设则测的是 load 工具自身 RSS,无门禁意义)。
#   2) 慢消费者需从 SDK 级(subscribe+sleep)升级为真 socket-stall,才算完整背压。
#   3) warmup 尚未在 backpressure 分支实现,故本 conf 不写 warmup_sec(避免假配置)。

[server]
host = "127.0.0.1"
port = 9001
protocol = "quic"

[users]
total = 100

[scenario]
type = "backpressure"

[rate]
connect_per_sec = 0
connect_concurrent = 50
msg_per_sec = 200
# gate 断言发送端吞吐下限(§B：慢消费者下发送端不应崩塌)
min_sender_tps = 50.0
# gate 硬要求:server RSS 必须有效(缺/错 LOAD_TEST_SERVER_PID → FAIL,不 SKIP 假绿)
require_server_rss = true

[run]
duration_sec = 600
# warmup_sec 暂不写:backpressure 分支未实现 warmup（避免假配置）。实现后再加。
