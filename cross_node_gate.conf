# CODEX-11 directional realtime gate. Client 0 connects to the primary server;
# client 1 connects to LOAD_TEST_SECONDARY_SERVER_HOST and receives every event.

[server]
host = "127.0.0.1"
port = 9001
protocol = "tcp"

[users]
total = 2

[scenario]
type = "soak"

[rate]
connect_per_sec = 0
connect_concurrent = 2
msg_per_sec = 5

[run]
duration_sec = 60
warmup_sec = 0
