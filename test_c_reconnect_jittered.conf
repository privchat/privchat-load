# G8 场景：重连认证峰值 —— jittered-realistic 到达模型（对照 test_c_reconnect.conf 的 burst）。
# 50 个重连在 window_ms 内按 ±30% jitter 铺开到达，更接近真实 server 重启风暴（SDK P0-12 抖动）。
[server]
host = "127.0.0.1"
port = 9501
protocol = "tcp"

[users]
total = 50

[scenario]
type = "reconnect_token_peak"

[arrival]
model = "jittered"
window_ms = 5000

[rate]
connect_per_sec = 0
connect_concurrent = 50
msg_per_sec = 10

[run]
duration_sec = 10
warmup_sec = 0
