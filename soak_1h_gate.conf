# CODEX-9 one-hour resource and realtime-delivery gate.
# Run with LOAD_TEST_SOAK_PROFILE=gate_1h plus valid server PID and metrics URL.

[server]
host = "127.0.0.1"
port = 9001
protocol = "tcp"

[users]
total = 20

[scenario]
type = "soak"

[rate]
connect_per_sec = 0
connect_concurrent = 20
msg_per_sec = 10

[run]
duration_sec = 3600
warmup_sec = 600
