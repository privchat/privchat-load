# P0-3 拉黑两账号端到端验证（+ P0-1 遗留 QR 扫码入群 21001 协议级验证）。
#
# 流程：A/B 结为好友 → direct 双向基线发送+投递 → B 拉黑 A →
#       A 发断言 20402 / B 发断言 20403 → check/list → 解除 → 双向恢复。
# QR 阶段：场景内补注册第 3 账号 C → DB 置 user_type=1 → C 首次 login →
#       A 建群取 qr_key → C 扫码入群断言 21001 → B 扫码入群阳性对照。
#
# 运行（对 config.storm.toml 的 TLS-only server，端口 9501）：
#   LOAD_TEST_USER_PREFIX=r3bl \
#   LOAD_TEST_SERVER_CERT=../privchat-server/certs/server.crt \
#   LOAD_TEST_DATABASE_URL=<beta 库 URL> \
#   ./target/release/privchat-load --config test_blacklist_e2e.conf
#
# LOAD_TEST_DATABASE_URL 缺省时 QR 阶段整段 SKIP（拉黑部分照常断言）。
# 账号持久化在 data/users_r3bl.txt（前缀命名空间，免撞旧 token）。

[server]
host = "127.0.0.1"
port = 9501
protocol = "tcp"

[users]
# A/B 两账号；QR 阶段的 C 由场景自行补注册（ensure_users total=3）。
total = 2

[scenario]
type = "blacklist_e2e"