# G10 soak：长时持续负载检测 server RSS/FD 无持续单调上涨（泄漏）。
# 这是**规定的 soak smoke**（15min，含 10min warmup 丢弃，per §3.1）。
#   gate:  duration_sec=3600(1h)/14400(4h)，warmup_sec=600，LOAD_TEST_SOAK_PROFILE=gate（强制有效 server PID+FD）
#   注：co-located 只作早期泄漏 smoke；官方 gate 需隔离 tier。
# 必须设 LOAD_TEST_SERVER_PID（gate profile 缺则 exit 1；无效 PID → RSS=0 → 硬 FAIL）。
[server]
host = "127.0.0.1"
port = 9501
protocol = "tcp"

[users]
total = 20

[scenario]
type = "soak"

[rate]
connect_per_sec = 0
connect_concurrent = 20
msg_per_sec = 10

[run]
duration_sec = 900
warmup_sec = 600
