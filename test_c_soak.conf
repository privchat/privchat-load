# G10 soak：长时持续负载检测 server RSS/FD 无持续单调上涨（泄漏）。
# 此为 smoke（短时，co-located）；官方 gate 用隔离 tier 长跑（duration_sec=3600/14400）。
[server]
host = "127.0.0.1"
port = 9501
protocol = "tcp"

[users]
total = 10

[scenario]
type = "soak"

[rate]
connect_per_sec = 0
connect_concurrent = 10
msg_per_sec = 5

[run]
duration_sec = 30
warmup_sec = 0
