# G8 场景：重连认证峰值（真实 reconnect storm = connect + token authenticate，无 bcrypt）。
# protocol=tcp 是 co-located smoke 的权威口径；QUIC 复跑改 protocol="quic"（本地自签会自动放行）。
[server]
host = "127.0.0.1"
port = 9501
protocol = "tcp"

[users]
# 峰值并发度 = total（reconnect_token_peak 一次性并发全部；rate.connect_concurrent 对本场景不生效）。
total = 50

[scenario]
type = "reconnect_token_peak"

[rate]
connect_per_sec = 0
connect_concurrent = 50
msg_per_sec = 10

[run]
duration_sec = 10
warmup_sec = 0
